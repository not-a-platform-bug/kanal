<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanal Chat Presence</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f7f8fb;
      color: #20242c;
    }

    main {
      max-width: 880px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 16px;
    }

    .toolbar,
    .composer {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cfd5df;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      background: #1769e0;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    #log {
      height: 420px;
      overflow: auto;
      padding: 12px;
      background: white;
      border: 1px solid #dde2eb;
      border-radius: 8px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
<main>
  <h1>Kanal Chat Presence</h1>
  <div class="toolbar">
    <input id="room" value="general" aria-label="Room">
    <button id="connect">Connect</button>
    <button id="join">Join</button>
  </div>
  <div class="composer">
    <input id="message" value="Hello from the browser" aria-label="Message">
    <button id="send">Send</button>
    <button id="typing">Typing</button>
  </div>
  <div id="log"></div>
</main>
<script>
  let socket;
  let ref = 1;
  const log = document.getElementById("log");
  const room = document.getElementById("room");
  const message = document.getElementById("message");

  function write(value) {
    log.textContent += `${value}\n`;
    log.scrollTop = log.scrollHeight;
  }

  function send(frame) {
    socket.send(JSON.stringify({ ref: String(ref++), ...frame }));
  }

  document.getElementById("connect").onclick = () => {
    const protocol = location.protocol === "https:" ? "wss" : "ws";
    socket = new WebSocket(`${protocol}://${location.host}/realtime`);
    socket.onopen = () => write("connected");
    socket.onmessage = (event) => write(event.data);
    socket.onclose = (event) => write(`closed ${event.code} ${event.reason}`);
  };

  document.getElementById("join").onclick = () => {
    send({ event: "join", channel: `chat/${room.value}`, payload: {} });
  };

  document.getElementById("send").onclick = () => {
    send({
      event: "message",
      channel: `chat/${room.value}`,
      payload: {
        messageId: crypto.randomUUID(),
        body: message.value
      }
    });
  };

  document.getElementById("typing").onclick = () => {
    send({
      event: "message",
      channel: `chat/${room.value}/typing`,
      payload: { typing: true }
    });
  };
</script>
</body>
</html>
